<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" class="d-off">
<style>
.d-off text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#111110}
.d-off .lbl{font-size:10px;font-weight:700;letter-spacing:.09em;fill:#9B9791}
.d-off .st{font-size:12.5px;font-weight:600}
.d-off .sm{font-size:11px;fill:#6E6B66}
.d-off .fa{font-size:10px;fill:#9B9791}
.d-off .mos{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#6E6B66}
.d-off .i-st{fill:#FFFFFF}
.d-off .i-sm{fill:#9B9791}
.d-off .free{fill:#2F2E2B;font-size:10px;font-weight:600}
</style>
<defs>
<marker id="oa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
<path d="M0 0.5 L7.5 4 L0 7.5 Z" fill="#9B9791"/>
</marker>
</defs>
<rect width="760" height="340" fill="#FFFFFF"/>

<text class="lbl" x="24" y="24">OFFERING LIFECYCLE · EXACTLY ONE TERMINAL STATE</text>

<!-- row 1 -->
<rect x="24" y="40" width="124" height="52" rx="10" fill="#FFFFFF" stroke="#E9E6E2"/>
<text class="st" x="44" y="64">Draft</text>
<text class="mos" x="44" y="80">createOffering</text>
<path d="M156 66 L186 66" stroke="#9B9791" stroke-width="1.3" marker-end="url(#oa)" fill="none"/>

<rect x="194" y="40" width="124" height="52" rx="10" fill="#F1EFEC" stroke="#DAD6D0"/>
<text class="st" x="214" y="64">Active</text>
<text class="mos" x="214" y="80">activate</text>
<path d="M326 66 L356 66" stroke="#9B9791" stroke-width="1.3" marker-end="url(#oa)" fill="none"/>

<rect x="364" y="40" width="124" height="52" rx="10" fill="#FFFFFF" stroke="#E9E6E2"/>
<text class="st" x="384" y="64">Paused</text>
<text class="mos" x="384" y="80">pause / resume</text>

<rect x="534" y="40" width="202" height="52" rx="10" fill="#F7F6F4" stroke="#E9E6E2"/>
<text class="sm" x="552" y="62">Purchases run the offering rules,</text>
<text class="sm" x="552" y="80">then the full token pipeline.</text>

<path d="M256 96 L256 122" stroke="#9B9791" stroke-width="1.3" marker-end="url(#oa)" fill="none"/>
<text class="mos" x="266" y="114">endAt or close</text>

<!-- row 2 -->
<rect x="194" y="128" width="124" height="52" rx="10" fill="#FFFFFF" stroke="#E9E6E2"/>
<text class="st" x="214" y="152">Closed</text>
<text class="mos" x="214" y="168">window over</text>

<path d="M256 184 L256 210" stroke="#9B9791" stroke-width="1.3" marker-end="url(#oa)" fill="none"/>
<path d="M326 154 L400 154" stroke="#9B9791" stroke-width="1.3" marker-end="url(#oa)" fill="none"/>
<text class="mos" x="330" y="146">soft cap met</text>

<rect x="408" y="128" width="150" height="52" rx="10" fill="#111110"/>
<text class="st i-st" x="428" y="152">Settled</text>
<text class="mos i-sm" x="428" y="168">issuer receives payment</text>

<text class="mos" x="120" y="216">soft cap missed</text>
<rect x="194" y="216" width="150" height="52" rx="10" fill="#111110"/>
<text class="st i-st" x="214" y="240">Refunding</text>
<text class="mos i-sm" x="214" y="256">investors get money back</text>

<rect x="408" y="216" width="150" height="52" rx="10" fill="#111110"/>
<text class="st i-st" x="428" y="240">Cancelled</text>
<text class="mos i-sm" x="428" y="256">before any purchase</text>

<path d="M566 242 L596 242" stroke="#9B9791" stroke-width="1.3" marker-end="url(#oa)" fill="none"/>
<rect x="604" y="216" width="132" height="52" rx="10" fill="#F7F6F4" stroke="#E9E6E2"/>
<text class="st" x="622" y="240">Archived</text>
<text class="mos" x="622" y="256">read-only</text>

<!-- permissionless note -->
<rect x="24" y="284" width="712" height="44" rx="10" fill="#FFFFFF" stroke="#DAD6D0"/>
<text class="free" x="44" y="302">settle AND beginRefunding ARE PERMISSIONLESS</text>
<text class="sm" x="44" y="320">Both are mechanical consequences of facts already on chain. Requiring an operator would let an absent one hold funds hostage.</text>
</svg>
