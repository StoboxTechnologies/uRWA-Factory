<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" class="d-subj">
<style>
.d-subj text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#111110}
.d-subj .lbl{font-size:10px;font-weight:700;letter-spacing:.09em;fill:#9B9791}
.d-subj .st{font-size:13.5px;font-weight:600}
.d-subj .big{font-size:24px;font-weight:600;letter-spacing:-.02em}
.d-subj .sm{font-size:11.5px;fill:#6E6B66}
.d-subj .fa{font-size:10.5px;fill:#9B9791}
.d-subj .mos{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;fill:#6E6B66}
.d-subj .bad{fill:#7A322A}
.d-subj .ok{fill:#2F2E2B}
.d-subj .i-st{fill:#FFFFFF}
.d-subj .i-sm{fill:#9B9791}
</style>
<defs>
<marker id="sa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0.5 L7.5 4 L0 7.5 Z" fill="#9B9791"/>
</marker>
</defs>
<rect width="760" height="356" fill="#FFFFFF"/>

<text class="lbl" x="24" y="24">THE CAP: NO MORE THAN 2 HOLDERS</text>

<!-- people -->
<rect x="24" y="40" width="200" height="196" rx="12" fill="#F7F6F4" stroke="#DAD6D0"/>
<text class="st" x="40" y="66">One investor</text>
<circle cx="56" cy="98" r="16" fill="#111110"/><text class="st i-st" x="50" y="103">I</text>
<text class="mos" x="82" y="94">subject</text>
<text class="mos" x="82" y="110">0x9f3c…</text>
<text class="sm" x="40" y="146">Opens three wallets. Nothing</text>
<text class="sm" x="40" y="162">stops them — linking is</text>
<text class="sm" x="40" y="178">self-service.</text>
<text class="fa" x="40" y="206">A second investor holds one</text>
<text class="fa" x="40" y="222">wallet. Two people in total.</text>

<!-- wallets -->
<rect x="252" y="40" width="180" height="196" rx="12" fill="#FFFFFF" stroke="#E9E6E2"/>
<text class="lbl" x="268" y="64">WALLETS ON CHAIN</text>
<rect x="268" y="76" width="148" height="26" rx="8" fill="#F1EFEC" stroke="#DAD6D0"/><text class="mos" x="282" y="93">0xA1…  investor 1</text>
<rect x="268" y="108" width="148" height="26" rx="8" fill="#F1EFEC" stroke="#DAD6D0"/><text class="mos" x="282" y="125">0xB2…  investor 1</text>
<rect x="268" y="140" width="148" height="26" rx="8" fill="#F1EFEC" stroke="#DAD6D0"/><text class="mos" x="282" y="157">0xC3…  investor 1</text>
<rect x="268" y="172" width="148" height="26" rx="8" fill="#FFFFFF" stroke="#DAD6D0"/><text class="mos" x="282" y="189">0xD4…  investor 2</text>
<text class="fa" x="268" y="220">Four addresses, two people.</text>

<path d="M436 138 L462 138" stroke="#9B9791" stroke-width="1.3" marker-end="url(#sa)" fill="none"/>

<!-- counting -->
<rect x="470" y="40" width="266" height="92" rx="12" fill="#FFFFFF" stroke="#E9E6E2"/>
<text class="lbl" x="486" y="64">COUNT ADDRESSES</text>
<text class="big bad" x="486" y="98">4 &gt; 2</text>
<text class="sm" x="556" y="98">cap appears breached</text>
<text class="fa" x="486" y="120">The honest investor is refused; the evasion is missed.</text>

<rect x="470" y="144" width="266" height="92" rx="12" fill="#111110"/>
<text class="lbl" x="486" y="168">COUNT SUBJECTS</text>
<text class="big i-st" x="486" y="202">2 = 2</text>
<text class="sm i-sm" x="556" y="202">cap correctly held</text>
<text class="fa i-sm" x="486" y="224">Splitting across wallets changes nothing.</text>

<!-- footer -->
<rect x="24" y="256" width="712" height="76" rx="12" fill="#F7F6F4" stroke="#E9E6E2"/>
<text class="st" x="44" y="282">Why this cannot be added later</text>
<text class="sm" x="44" y="304">Subject balances and subject holder counts are maintained inside transfer accounting, because they</text>
<text class="sm" x="44" y="322">cannot be derived at read time within gas limits — and cannot be reconstructed from history afterwards.</text>
</svg>
