<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" class="d-pol">
<style>
.d-pol text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0C0C0F}
.d-pol .lbl{font-size:10px;font-weight:700;letter-spacing:.09em;fill:#6E6E73}
.d-pol .st{font-size:12.5px;font-weight:600}
.d-pol .sm{font-size:11px;fill:#57575B}
.d-pol .fa{font-size:10.5px;fill:#6E6E73}
.d-pol .mos{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;fill:#57575B}
.d-pol .op{font-size:12px;font-weight:700;fill:#6E6E73;letter-spacing:.06em}
.d-pol .i-st{fill:#FFFFFF}
.d-pol .i-sm{fill:#6E6E73}
.d-pol .bad{fill:#B42318;font-size:10.5px;font-weight:600}

.d-pol .hdt{font-size:18px;font-weight:700;letter-spacing:-.022em;fill:#1D1D1F}
.d-pol .hdk{font-size:10.5px;font-weight:700;letter-spacing:.12em;fill:#6E6E73}
.d-pol .ico{fill:none;stroke:#0C0C0F;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="760" height="420" fill="#FFFFFF"/>
<!-- header -->
<rect x="24" y="16" width="56" height="56" rx="16" fill="#22D3EE" fill-opacity="0.16" stroke="#A5E9F4"/><g class="ico" transform="translate(36,28) scale(1.3333)"><path d="M2.8 4h18.4l-7.2 8.2V20l-4-2.2v-5.6Z"/></g><text class="hdk" x="98" y="36">DIAGRAM</text><text class="hdt" x="98" y="60">Policy evaluation</text><rect x="24" y="92" width="712.0" height="1" fill="#E2E4E9"/>
<g transform="translate(0,92)">

<text class="lbl" x="24" y="24">GROUPS ARE AND-ED · RULES INSIDE A GROUP ARE ANY-OF</text>

<!-- group 1 -->
<rect x="24" y="36" width="222" height="146" rx="12" fill="#F5F5F7" stroke="#D2D5DB"/>
<text class="st" x="44" y="60">Group 1 — identity</text>
<rect x="44" y="72" width="182" height="28" rx="8" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mos" x="58" y="90">HasValidIdentity</text>
<text class="fa" x="44" y="122">One rule. It must pass.</text>
<text class="fa" x="44" y="140">The base gate every regime</text>
<text class="fa" x="44" y="158">starts from.</text>

<text class="op" x="256" y="114">AND</text>

<!-- group 2 -->
<rect x="300" y="36" width="222" height="146" rx="12" fill="#F5F5F7" stroke="#D2D5DB"/>
<text class="st" x="320" y="60">Group 2 — eligibility</text>
<rect x="320" y="72" width="182" height="26" rx="8" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mos" x="334" y="89">USAccreditedOnly</text>
<text class="op" x="320" y="112">OR</text>
<rect x="320" y="120" width="182" height="26" rx="8" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mos" x="334" y="137">EUProfessionalOnly</text>
<text class="fa" x="320" y="162">Either route qualifies — one</text>
<text class="fa" x="320" y="176">token, two eligible populations.</text>

<text class="op" x="532" y="114">AND</text>

<!-- group 3 -->
<rect x="576" y="36" width="160" height="146" rx="12" fill="#F5F5F7" stroke="#D2D5DB"/>
<text class="st" x="596" y="60">Group 3 — limits</text>
<rect x="596" y="72" width="122" height="26" rx="8" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mos" x="610" y="89">MaxHolders</text>
<rect x="596" y="104" width="122" height="26" rx="8" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mos" x="610" y="121">HoldPeriod</text>
<text class="fa" x="596" y="150">Both apply; each is its</text>
<text class="fa" x="596" y="166">own group in practice.</text>

<!-- how a rule is called -->
<rect x="24" y="204" width="348" height="106" rx="10" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="lbl" x="44" y="228">HOW EACH RULE IS CALLED</text>
<text class="mos" x="44" y="252">try Rule.check{gas: CEILING}(from, to, amount)</text>
<text class="sm" x="44" y="276">Stateless. Never writes. Shared across every token</text>
<text class="sm" x="44" y="292">on the chain, deployed once.</text>

<rect x="388" y="204" width="348" height="106" rx="10" fill="#0C0C0F"/>
<text class="lbl i-sm" x="408" y="228">IF A RULE REVERTS OR RUNS OUT OF GAS</text>
<text class="st i-st" x="408" y="254">It counts as a refusal</text>
<text class="fa i-sm" x="408" y="278">RuleFailed is emitted so the failure is visible, and the</text>
<text class="fa i-sm" x="408" y="294">transfer stops. A broken rule never opens the gate.</text></g>
</svg>
