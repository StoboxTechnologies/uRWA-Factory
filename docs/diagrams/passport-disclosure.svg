<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" class="d-pass">
<style>
.d-pass text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0C0C0F}
.d-pass .lbl{font-size:10px;font-weight:700;letter-spacing:.09em;fill:#6E6E73}
.d-pass .st{font-size:13px;font-weight:600}
.d-pass .sm{font-size:11.5px;fill:#57575B}
.d-pass .fa{font-size:10.5px;fill:#6E6E73}
.d-pass .mo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#3C3C43}
.d-pass .mos{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;fill:#57575B}
.d-pass .i-st{fill:#FFFFFF}
.d-pass .i-sm{fill:#6E6E73}
.d-pass .i-mo{fill:#F0F2F8}
</style>
<defs>
<marker id="pa2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
<path d="M0 0.5 L7.5 4 L0 7.5 Z" fill="#6E6E73"/>
</marker>
</defs>
<rect width="760" height="420" fill="#FFFFFF"/>

<!-- off chain -->
<rect x="24" y="16" width="330" height="228" rx="12" fill="#F5F5F7" stroke="#D2D5DB"/>
<text class="lbl" x="44" y="42">OFF CHAIN · THE VALUES THEMSELVES</text>
<rect x="44" y="54" width="290" height="30" rx="8" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mos" x="58" y="73">valuation = 4,200,000 EUR   salt 0x8c1f…</text>
<rect x="44" y="90" width="290" height="30" rx="8" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mos" x="58" y="109">jurisdiction = EE            salt 0x2b70…</text>
<rect x="44" y="126" width="290" height="30" rx="8" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mos" x="58" y="145">title deed hash              salt 0xd4a9…</text>
<text class="sm" x="44" y="180">Every leaf carries 32 bytes of unique salt.</text>
<text class="fa" x="44" y="200">Without it, a boolean or an enum commitment is broken by</text>
<text class="fa" x="44" y="216">hashing every candidate — which is most of a passport.</text>
<text class="fa" x="44" y="234">Documents and personal data never leave this box.</text>

<path d="M362 130 L392 130" stroke="#6E6E73" stroke-width="1.3" marker-end="url(#pa2)" fill="none"/>
<text class="fa" x="358" y="120">hash</text>

<!-- tree -->
<rect x="400" y="16" width="336" height="228" rx="12" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="lbl" x="420" y="42">SPARSE MERKLE TREE</text>
<circle cx="568" cy="72" r="16" fill="#0C0C0F"/><text class="mos i-mo" x="556" y="76">root</text>
<path d="M556 85 L512 108" stroke="#D2D5DB" stroke-width="1.2" fill="none"/>
<path d="M580 85 L624 108" stroke="#D2D5DB" stroke-width="1.2" fill="none"/>
<circle cx="504" cy="118" r="12" fill="#F0F2F8" stroke="#D2D5DB"/>
<circle cx="632" cy="118" r="12" fill="#F0F2F8" stroke="#D2D5DB"/>
<path d="M494 127 L468 148" stroke="#D2D5DB" stroke-width="1.2" fill="none"/>
<path d="M514 127 L540 148" stroke="#D2D5DB" stroke-width="1.2" fill="none"/>
<path d="M622 127 L596 148" stroke="#D2D5DB" stroke-width="1.2" fill="none"/>
<path d="M642 127 L668 148" stroke="#D2D5DB" stroke-width="1.2" fill="none"/>
<rect x="450" y="152" width="36" height="20" rx="5" fill="#FFFFFF" stroke="#E2E4E9"/>
<rect x="522" y="152" width="36" height="20" rx="5" fill="#FFFFFF" stroke="#E2E4E9"/>
<rect x="578" y="152" width="36" height="20" rx="5" fill="#FFFFFF" stroke="#E2E4E9"/>
<rect x="650" y="152" width="36" height="20" rx="5" fill="#F5F5F7" stroke="#E2E4E9" stroke-dasharray="3 2"/>
<text class="fa" x="420" y="196">The tree spans the whole key space, so a leaf that was</text>
<text class="fa" x="420" y="212">never written is provably empty. Absence is provable —</text>
<text class="fa" x="420" y="228">"we hold no environmental report" is a verifiable claim.</text>

<!-- on chain -->
<rect x="24" y="260" width="712" height="66" rx="12" fill="#0C0C0F"/>
<text class="lbl i-sm" x="44" y="284">ON CHAIN · ONE SNAPSHOT PER VERSION</text>
<text class="mo i-mo" x="44" y="308">root · revocationRoot · version · takenAt · schemaVersion — and nothing else</text>

<!-- verify -->
<rect x="24" y="340" width="348" height="64" rx="10" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="st" x="44" y="364">Anyone verifies without asking us</text>
<text class="mos" x="44" y="386">verify(id, code, value, salt, proof) → bool</text>

<rect x="388" y="340" width="348" height="64" rx="10" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="st" x="408" y="364">A proof binds to one root</text>
<text class="fa" x="408" y="386">Re-snapshot and old proofs stop verifying. That is the point.</text>
</svg>
