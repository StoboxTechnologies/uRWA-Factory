<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524" width="760" height="524" class="d-planes">
<style>
.d-planes text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0C0C0F}
.d-planes .lbl{font-size:10px;font-weight:700;letter-spacing:.09em;fill:#57575B}
.d-planes .nm{font-size:16px;font-weight:600;letter-spacing:-.01em}
.d-planes .it{font-size:12.5px;fill:#3C3C43}
.d-planes .mo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#3C3C43}
.d-planes .sm{font-size:11.5px;fill:#57575B}
.d-planes .fa{font-size:11px;fill:#6E6E73}
.d-planes .arw{stroke:#6E6E73;stroke-width:1.4;fill:none}
/* Inverted text needs its own class: a CSS rule beats a fill="" attribute,
   so setting the colour inline would be silently overridden. */
.d-planes .i-nm{fill:#FFFFFF}
.d-planes .i-lbl{fill:#F0F2F8}
.d-planes .i-sm{fill:#6E6E73}
.d-planes .i-mo{fill:#F0F2F8}

.d-planes .hdt{font-size:18px;font-weight:700;letter-spacing:-.022em;fill:#1D1D1F}
.d-planes .hdk{font-size:10.5px;font-weight:700;letter-spacing:.12em;fill:#6E6E73}
.d-planes .ico{fill:none;stroke:#0C0C0F;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<marker id="pa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0.5 L7.5 4 L0 7.5 Z" fill="#6E6E73"/>
</marker>
</defs>
<rect width="760" height="524" fill="#FFFFFF"/>
<!-- header -->
<rect x="24" y="16" width="56" height="56" rx="16" fill="#22D3EE" fill-opacity="0.16" stroke="#A5E9F4"/><g class="ico" transform="translate(36,28) scale(1.3333)"><path d="M12 2.5 21.5 8 12 13.5 2.5 8Z"/><path d="M2.5 12 12 17.5 21.5 12"/><path d="M2.5 16 12 21.5 21.5 16"/></g><text class="hdk" x="98" y="36">DIAGRAM</text><text class="hdt" x="98" y="60">Three planes</text><rect x="24" y="92" width="712" height="1" fill="#E2E4E9"/>
<g transform="translate(0,92)">

<!-- claims plane -->
<rect x="24" y="16" width="470" height="112" rx="12" fill="#F5F5F7" stroke="#D2D5DB"/>
<rect x="40" y="30" width="86" height="18" rx="9" fill="#FFFFFF" stroke="#D2D5DB"/>
<text class="lbl" x="52" y="42.5">EXTENSIBLE</text>
<text class="nm" x="40" y="72">Claims</text>
<text class="sm" x="118" y="72">who someone is</text>
<rect x="40" y="86" width="128" height="28" rx="8" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mo" x="54" y="104">Allowlist</text>
<rect x="176" y="86" width="128" height="28" rx="8" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mo" x="190" y="104">EAS</text>
<rect x="312" y="86" width="166" height="28" rx="8" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mo" x="326" y="104">StoboxDID</text>

<rect x="510" y="16" width="226" height="112" rx="12" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="lbl" x="528" y="42.5">IF IT BREAKS</text>
<text class="it" x="528" y="68">Claims stop resolving.</text>
<text class="it" x="528" y="86">Transfers block.</text>
<text class="fa" x="528" y="110">Swap the adapter. No balance moves.</text>

<path class="arw" d="M259 128 L259 148" marker-end="url(#pa)"/>
<text class="fa" x="271" y="143">rules read claims</text>

<!-- policy plane -->
<rect x="24" y="152" width="470" height="112" rx="12" fill="#F5F5F7" stroke="#D2D5DB"/>
<rect x="40" y="166" width="94" height="18" rx="9" fill="#FFFFFF" stroke="#D2D5DB"/>
<text class="lbl" x="52" y="178.5">REPLACEABLE</text>
<text class="nm" x="40" y="208">Policy</text>
<text class="sm" x="112" y="208">what they may do</text>
<rect x="40" y="222" width="150" height="28" rx="8" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mo" x="54" y="240">PolicySet</text>
<rect x="198" y="222" width="280" height="28" rx="8" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mo" x="212" y="240">12 stateless rules · groups AND-ed</text>

<rect x="510" y="152" width="226" height="112" rx="12" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="lbl" x="528" y="178.5">IF IT BREAKS</text>
<text class="it" x="528" y="204">Trading halts.</text>
<text class="it" x="528" y="222">Balances are untouched.</text>
<text class="fa" x="528" y="246">setPolicySet — one transaction.</text>

<path class="arw" d="M259 264 L259 284" marker-end="url(#pa)"/>
<text class="fa" x="271" y="279">the hook calls the policy set</text>

<!-- ledger plane -->
<rect x="24" y="288" width="470" height="112" rx="12" fill="#0C0C0F"/>
<rect x="40" y="302" width="82" height="18" rx="9" fill="#1D1D1F"/>
<text class="lbl i-lbl" x="52" y="314.5">IMMUTABLE</text>
<text class="nm i-nm" x="40" y="344">Ledger</text>
<text class="sm i-sm" x="122" y="344">who owns what</text>
<rect x="40" y="358" width="438" height="28" rx="8" fill="#1D1D1F"/>
<text class="mo i-mo" x="54" y="376">ERC-20 core · balances · supply · allowances</text>

<rect x="510" y="288" width="226" height="112" rx="12" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="lbl" x="528" y="314.5">IF IT BREAKS</text>
<text class="it" x="528" y="340">It cannot.</text>
<text class="fa" x="528" y="364">Selectors are registered against</text>
<text class="fa" x="528" y="380">the diamond itself. diamondCut</text>
<text class="fa" x="528" y="396">reverts rather than replacing them.</text></g>
</svg>
