<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" class="d-role">
<style>
.d-role text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0C0C0F}
.d-role .lbl{font-size:10px;font-weight:700;letter-spacing:.09em;fill:#6E6E73}
.d-role .st{font-size:12.5px;font-weight:600}
.d-role .sm{font-size:11px;fill:#57575B}
.d-role .fa{font-size:10.5px;fill:#6E6E73}
.d-role .mos{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;fill:#57575B}
.d-role .i-st{fill:#FFFFFF}
.d-role .i-sm{fill:#6E6E73}
.d-role .no{fill:#B42318;font-size:10.5px;font-weight:600}
.d-role .warn{fill:#B45309;font-size:10.5px;font-weight:600}

.d-role .hdt{font-size:18px;font-weight:700;letter-spacing:-.022em;fill:#1D1D1F}
.d-role .hdk{font-size:10.5px;font-weight:700;letter-spacing:.12em;fill:#6E6E73}
.d-role .ico{fill:none;stroke:#0C0C0F;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="760" height="412" fill="#FFFFFF"/>
<!-- header -->
<rect x="24" y="16" width="56" height="56" rx="16" fill="#22D3EE" fill-opacity="0.16" stroke="#A5E9F4"/><g class="ico" transform="translate(36,28) scale(1.3333)"><circle cx="7.5" cy="12" r="4.2"/><path d="M11.7 12H21.5"/><path d="M17.5 12v4"/><path d="M20.5 12v3"/></g><text class="hdk" x="98" y="36">DIAGRAM</text><text class="hdt" x="98" y="60">Role separation</text><rect x="24" y="92" width="712" height="1" fill="#E2E4E9"/>
<g transform="translate(0,92)">

<text class="lbl" x="24" y="24">FOUR ROLES · SEPARATED SO NO ONE OF THEM CAN ACT ALONE</text>

<rect x="24" y="36" width="172" height="118" rx="10" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mos" x="42" y="60">UPGRADE_ADMIN</text>
<text class="st" x="42" y="84">Changes the code</text>
<text class="sm" x="42" y="106">Facets, policy set,</text>
<text class="sm" x="42" y="122">identity registry.</text>
<text class="no" x="42" y="144">Cannot touch a balance</text>

<rect x="206" y="36" width="172" height="118" rx="10" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mos" x="224" y="60">SUPPLY_OPERATOR</text>
<text class="st" x="224" y="84">Moves supply</text>
<text class="sm" x="224" y="106">Issue, redeem,</text>
<text class="sm" x="224" y="122">distribute.</text>
<text class="no" x="224" y="144">Cannot freeze or seize</text>

<rect x="388" y="36" width="172" height="118" rx="10" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mos" x="406" y="60">COMPLIANCE_OFFICER</text>
<text class="st" x="406" y="84">Restricts holders</text>
<text class="sm" x="406" y="106">Freeze, lockup, pause,</text>
<text class="sm" x="406" y="122">forced transfer.</text>
<text class="no" x="406" y="144">Cannot mint</text>

<rect x="570" y="36" width="166" height="118" rx="10" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mos" x="588" y="60">ISSUER_ADMIN</text>
<text class="st" x="588" y="84">Configures</text>
<text class="sm" x="588" y="106">Trust list, metadata,</text>
<text class="sm" x="588" y="122">offering setup.</text>
<text class="no" x="588" y="144">Cannot upgrade</text>

<!-- the dangerous pairing -->
<rect x="24" y="174" width="356" height="126" rx="10" fill="#F5F5F7" stroke="#D2D5DB"/>
<text class="warn" x="44" y="198">THE PAIRING THE CONSOLE WARNS ABOUT</text>
<text class="st" x="44" y="224">SUPPLY_OPERATOR = COMPLIANCE_OFFICER</text>
<text class="sm" x="44" y="248">Together they can mint to an address and freeze</text>
<text class="sm" x="44" y="264">everyone else — which removes the check each</text>
<text class="sm" x="44" y="280">provides on the other.</text>
<text class="fa" x="44" y="296">The deploy console warns. It does not block: small issuers exist.</text>

<rect x="396" y="174" width="340" height="126" rx="10" fill="#0C0C0F"/>
<text class="lbl i-sm" x="416" y="198">THE INVARIANT THAT MAKES THIS HOLD</text>
<text class="st i-st" x="416" y="226">A compromised upgrade admin</text>
<text class="st i-st" x="416" y="244">cannot change a balance</text>
<text class="fa i-sm" x="416" y="270">Not by policy — by construction. The ERC-20 selectors are</text>
<text class="fa i-sm" x="416" y="286">not replaceable, so no facet it installs can reach them.</text></g>
</svg>
