<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" class="d-link">
<style>
.d-link text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0C0C0F}
.d-link .lbl{font-size:10px;font-weight:700;letter-spacing:.09em;fill:#6E6E73}
.d-link .st{font-size:13px;font-weight:600}
.d-link .sm{font-size:11.5px;fill:#57575B}
.d-link .fa{font-size:10.5px;fill:#6E6E73}
.d-link .mo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#3C3C43}
.d-link .mos{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;fill:#57575B}
.d-link .i-st{fill:#FFFFFF}
.d-link .i-sm{fill:#6E6E73}
.d-link .warn{fill:#B42318;font-size:11.5px;font-weight:600}

.d-link .hdt{font-size:18px;font-weight:700;letter-spacing:-.022em;fill:#1D1D1F}
.d-link .hdk{font-size:10.5px;font-weight:700;letter-spacing:.12em;fill:#6E6E73}
.d-link .ico{fill:none;stroke:#0C0C0F;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<marker id="la" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0.5 L7.5 4 L0 7.5 Z" fill="#6E6E73"/>
</marker>
</defs>
<rect width="760" height="580" fill="#FFFFFF"/>
<!-- header -->
<rect x="24" y="16" width="56" height="56" rx="16" fill="#22D3EE" fill-opacity="0.16" stroke="#A5E9F4"/><g class="ico" transform="translate(36,28) scale(1.3333)"><path d="M9.5 14.5 14.5 9.5"/><path d="M8 12.2 5.6 14.6a3.9 3.9 0 0 0 5.5 5.5l2.4-2.4"/><path d="M10.5 6.3 12.9 3.9a3.9 3.9 0 0 1 5.5 5.5L16 11.8"/></g><text class="hdk" x="98" y="36">DIAGRAM</text><text class="hdt" x="98" y="60">Wallet to DID</text><rect x="24" y="92" width="712" height="1" fill="#E2E4E9"/>
<g transform="translate(0,92)">

<!-- step 1 -->
<text class="lbl" x="24" y="24">1 · THE OPERATOR CREATES THE SUBJECT</text>
<rect x="24" y="36" width="330" height="86" rx="10" fill="#F5F5F7" stroke="#D2D5DB"/>
<text class="mo" x="40" y="60">createDID(uDID, wallet, validTo, blocked)</text>
<rect x="40" y="72" width="112" height="22" rx="11" fill="#0C0C0F"/>
<text class="fa i-sm" x="52" y="87">WRITER_ROLE ONLY</text>
<text class="sm" x="40" y="112">After KYC. Creates the subject and links the first wallet.</text>

<rect x="392" y="36" width="344" height="86" rx="10" fill="#FFFFFF" stroke="#E2E4E9"/>
<circle cx="424" cy="72" r="15" fill="#0C0C0F"/>
<text class="st i-st" x="418.5" y="76">S</text>
<text class="st" x="452" y="68">Subject</text>
<text class="mos" x="452" y="86">keccak256(uDID) — one person, one key</text>
<text class="fa" x="452" y="106">Balances, caps and reports are counted against this.</text>

<path d="M380 79 L390 79" stroke="#6E6E73" stroke-width="1.3" marker-end="url(#la)" fill="none"/>

<!-- step 2 -->
<text class="lbl" x="24" y="164">2 · THE HOLDER ADDS THEIR OWN WALLETS</text>
<rect x="24" y="176" width="330" height="104" rx="10" fill="#F5F5F7" stroke="#D2D5DB"/>
<text class="mo" x="40" y="200">linkAddressToDID(existing, new)</text>
<rect x="40" y="212" width="196" height="22" rx="11" fill="#1D1D1F"/>
<text class="fa i-sm" x="52" y="227">WRITER_ROLE — OR THE DID OWNER</text>
<text class="sm" x="40" y="252">No operator, no ticket, no fee. The caller's own wallet</text>
<text class="sm" x="40" y="268">must resolve to the same subject and not be deactivated.</text>

<rect x="392" y="176" width="344" height="104" rx="10" fill="#FFFFFF" stroke="#E2E4E9"/>
<circle cx="424" cy="212" r="13" fill="#F0F2F8" stroke="#D2D5DB"/><text class="mos" x="418" y="216">A</text>
<circle cx="460" cy="212" r="13" fill="#F0F2F8" stroke="#D2D5DB"/><text class="mos" x="454" y="216">B</text>
<circle cx="496" cy="212" r="13" fill="#F0F2F8" stroke="#D2D5DB"/><text class="mos" x="490" y="216">C</text>
<circle cx="532" cy="212" r="13" fill="#0C0C0F"/><text class="mos i-st" x="526" y="216">D</text>
<text class="fa" x="556" y="216">…up to 10</text>
<text class="mos" x="408" y="248">linker[D] = [D, A, B, C]   the new wallet, complete</text>
<text class="mos" x="408" y="266">linker[A…C].push(D)        each existing one gains D</text>

<!-- step 3 -->
<text class="lbl" x="24" y="322">3 · LEAVING — THREE OPERATIONS, THREE AUTHORITIES</text>

<rect x="24" y="334" width="232" height="136" rx="10" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mo" x="40" y="358">deactivateAddressOfDID</text>
<text class="sm" x="40" y="378">Writer or the holder</text>
<text class="warn" x="40" y="400">Holder can undo it</text>
<text class="fa" x="40" y="420">activateAddressOfDID sits behind</text>
<text class="fa" x="40" y="436">the same guard, so this is never</text>
<text class="fa" x="40" y="452">an enforcement signal.</text>

<rect x="272" y="334" width="232" height="136" rx="10" fill="#FFFFFF" stroke="#E2E4E9"/>
<text class="mo" x="288" y="358">removeLinkedAddress</text>
<text class="sm" x="288" y="378">WRITER_ROLE only</text>
<text class="st" x="288" y="400">Authoritative</text>
<text class="fa" x="288" y="420">Deletes the link. Refuses on the</text>
<text class="fa" x="288" y="436">last wallet, so a subject can</text>
<text class="fa" x="288" y="452">never become unreachable.</text>

<rect x="520" y="334" width="216" height="136" rx="10" fill="#0C0C0F"/>
<text class="mo i-sm" x="536" y="358">blockDID</text>
<text class="sm i-sm" x="536" y="378">WRITER_ROLE only</text>
<text class="st i-st" x="536" y="400">Stops the person</text>
<text class="fa i-sm" x="536" y="420">The only instrument that acts</text>
<text class="fa i-sm" x="536" y="436">on every wallet of the subject</text>
<text class="fa i-sm" x="536" y="452">at once.</text></g>
</svg>
