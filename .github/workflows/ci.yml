name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-in-sync:
    name: Documentation is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild documentation
        run: python3 build-docs.py

      - name: Fail if the committed build is stale
        run: |
          if ! git diff --quiet -- index.html start.html pages/; then
            echo "::error::the built site is stale. Run 'python3 build-docs.py' and commit the result."
            git diff --stat -- index.html start.html pages/
            exit 1
          fi

  verify:
    name: Models and documentation verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # L5 first. If the checks themselves are dead, a green L0-L2 run means
      # nothing, and reporting it as a pass would be worse than not checking.
      - name: L5 — the checks are alive
        run: python3 verify.py --self-test --verbose

      - name: L0, L1, L2 — structure, documents, models
        run: python3 verify.py --verbose

  open-boundary:
    name: Open boundary holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No Stobox contract addresses in source
        run: |
          if grep -rniE '0x(096d75d0|b05cf4f6|25e60361|a832662d|85a3eae3|1cb9bd2c|998a0bea|e0c0f44a)' \
              --include='*.sol' --include='*.ts' --include='*.js' src/ test/ script/ 2>/dev/null; then
            echo "::error::a known Stobox contract address appears in source"
            exit 1
          fi
          echo "no Stobox addresses in source"

      - name: No STBU reference in source
        run: |
          if grep -rniE '\bSTBU\b' --include='*.sol' src/ test/ script/ 2>/dev/null; then
            echo "::error::STBU referenced in contract source; the open distribution must not know about it"
            exit 1
          fi
          echo "no STBU reference in source"

