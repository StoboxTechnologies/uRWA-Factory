name: Documentation site

on:
  push:
    branches: [main]
    paths: ['docs/**', 'README.md', 'build-docs.py', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build documentation
        run: python3 build-docs.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp urwa-documentation.html _site/index.html
          cp -r docs _site/docs
          cp README.md LICENSE NOTICE AUTHORS CITATION.cff _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
